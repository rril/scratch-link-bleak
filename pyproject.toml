[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scratch-link-bleak"
version = "0.1.1"
description = "Experimental unofficial Scratch Link BLE bridge for LEGO WeDo 2.0 on Linux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.22,<3",
    "websockets==13.1",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
keywords = ["scratch", "lego", "wedo", "ble", "linux"]
# License is intentionally pending provenance review.

[project.scripts]
scratch-link-bleak = "scratch_link_bleak_cli:run"

[project.urls]
Repository = "https://github.com/rril/scratch-link-bleak"
Issues = "https://github.com/rril/scratch-link-bleak/issues"

[tool.setuptools]
py-modules = ["scratch_link_bleak", "scratch_link_bleak_cli"]
