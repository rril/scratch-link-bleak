name: Publish Python package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NSS tools for certificate integration test
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools
      - name: Install build tools
        run: python -m pip install --upgrade build twine packaging
      - name: Validate release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib
          from packaging.version import Version
          metadata = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          name = metadata["project"]["name"]
          version = metadata["project"]["version"]
          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          assert name == "scratch-link-bleak", f"Unexpected package name: {name}"
          assert Version(version) == Version(expected), f"Release tag {expected} != package version {version}"
          print(f"Building {name} {version}")
          PY
      - name: Install package and run smoke tests
        run: |
          python -m pip install .
          python -m unittest discover -s tests -v
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI via trusted publishing
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/scratch-link-bleak
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
